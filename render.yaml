services:
  - type: web
    name: my-biseo
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PIN_LOOKUP_SECRET
        generateValue: true
